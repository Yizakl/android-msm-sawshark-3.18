name: Compile Sawshark Kernel

on:
  workflow_dispatch: 

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
    - name: Initialize Workspace
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev bc libssl-dev flex bison libelf-dev git ccache ncurses-dev lib32z1 lib32stdc++6 libc6:i386 libstdc++6:i386 libncurses5:i386 libtinfo5:i386

    - name: Clone Kernel Source
      run: |
        git clone --depth=1 https://github.com/linckandrea/android-msm-sawshark-3.18.git kernel-source

    - name: Download GCC 4.9 Toolchain (LineageOS Fork)
      run: |
        # 關鍵修復：改用 LineageOS 備份的分支，這裡面才有真正的編譯器檔案！
        git clone --depth=1 -b lineage-18.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gnu-toolchain

    - name: Verify Toolchain Execution
      run: |
        echo "=== 檢查編譯器目錄是否不再是空殼 ==="
        ls -la ${{ github.workspace }}/gnu-toolchain/bin/
        
        echo "=== 測試編譯器執行 ==="
        ${{ github.workspace }}/gnu-toolchain/bin/arm-linux-androideabi-gcc -v

    - name: Configure and Build Kernel
      run: |
        cd kernel-source
        export ARCH=arm
        export CROSS_COMPILE=${{ github.workspace }}/gnu-toolchain/bin/arm-linux-androideabi-
        
        # 載入配置
        make sawshark_full_defconfig
        
        # 開始編譯核心 (全核心加速，關閉語法警告)
        make -j$(nproc) KCFLAGS=-w

    - name: Find and Verify zImage
      run: |
        echo "=== 檢查編譯產物 ==="
        ls -la kernel-source/arch/arm/boot/ || true
        
        mkdir -p output
        if [ -f "kernel-source/arch/arm/boot/zImage-dtb" ]; then
          cp kernel-source/arch/arm/boot/zImage-dtb output/
          echo "成功找到 zImage-dtb"
        elif [ -f "kernel-source/arch/arm/boot/zImage" ]; then
          cp kernel-source/arch/arm/boot/zImage output/
          echo "成功找到 zImage"
        else
          echo "錯誤：未找到編譯出的核心檔案！" && exit 1
        fi

    - name: Upload zImage Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sawshark-zImage
        path: output/
