name: Compile Sawshark Kernel

on:
  workflow_dispatch: # 允許手動點擊按鈕觸發編譯

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
    # 1. 僅初始化乾淨的工作目錄
    - name: Initialize Workspace
      uses: actions/checkout@v4

    # 2. 安裝編譯必備套件
    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev bc libssl-dev flex bison libelf-dev git ccache ncurses-dev lib32z1

    # 3. 手動標準 Clone 核心源代碼
    - name: Manually Clone Kernel Source
      run: |
        git clone --depth=1 https://github.com/linckandrea/android-msm-sawshark-3.18.git kernel-source

    # 4. 修正：切換到清華大學開源鏡像站下載 AOSP GCC 4.9 工具鏈 (100% 公開且穩定)
    - name: Download GCC 4.9 Toolchain
      run: |
        git clone --depth=1 https://mirrors.tuna.tsinghua.edu.tw/git/AOSP/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git gnu-toolchain

    # 5. 進入源代碼目錄並編譯
    - name: Configure and Build Kernel
      run: |
        cd kernel-source
        
        # 設定交叉編譯環境變數
        export ARCH=arm
        export CROSS_COMPILE=${{ github.workspace }}/gnu-toolchain/bin/arm-linux-androideabi-
        
        # 載入 sawshark 的預設配置
        make msm-sawshark_defconfig
        
        # 開始編譯核心（使用全核心加速，並加上 KCFLAGS=-w 忽略新環境下的語法警告）
        make -j$(nproc) KCFLAGS=-w

    # 6. 驗證並提取 zImage-dtb
    - name: Find and Verify zImage
      run: |
        echo "=== 檢查編譯產物 ==="
        ls -la kernel-source/arch/arm/boot/
        
        mkdir -p output
        if [ -f "kernel-source/arch/arm/boot/zImage-dtb" ]; then
          cp kernel-source/arch/arm/boot/zImage-dtb output/
          echo "成功找到 zImage-dtb"
        elif [ -f "kernel-source/arch/arm/boot/zImage" ]; then
          cp kernel-source/arch/arm/boot/zImage output/
          echo "成功找到 zImage"
        else
          echo "錯誤：未找到編譯出的核心檔案！" && exit 1
        fi

    # 7. 上傳產物
    - name: Upload zImage Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sawshark-zImage
        path: output/
