name: Compile Sawshark Kernel & Auto Pack

on:
  workflow_dispatch: 

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
    - name: Initialize Workspace
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev bc libssl-dev flex bison libelf-dev git ccache ncurses-dev lib32z1 lib32stdc++6 libc6:i386 libstdc++6:i386 libncurses5:i386 libtinfo5:i386 abootimg

    - name: Clone Kernel Source
      run: |
        git clone --depth=1 https://github.com/linckandrea/android-msm-sawshark-3.18.git kernel-source

    - name: Download GCC 4.9 Toolchain (LineageOS Fork)
      run: |
        git clone --depth=1 -b lineage-18.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gnu-toolchain

    - name: Verify Toolchain Execution
      run: |
        echo "=== 檢查編譯器目錄 ==="
        ls -la ${{ github.workspace }}/gnu-toolchain/bin/
        echo "=== 測試編譯器執行 ==="
        ${{ github.workspace }}/gnu-toolchain/bin/arm-linux-androideabi-gcc -v

    - name: Configure and Build Kernel
      run: |
        cd kernel-source
        export ARCH=arm
        export CROSS_COMPILE=${{ github.workspace }}/gnu-toolchain/bin/arm-linux-androideabi-
        
        # 載入華為 Watch 2 專用配置
        make sawshark_full_defconfig
        
        # 強制編譯帶有設備樹的 zImage-dtb 目標
        make -j$(nproc) zImage-dtb KCFLAGS=-w

    - name: Process and Fix Device Tree (DTB)
      run: |
        mkdir -p ${{ github.workspace }}/output
        cd kernel-source
        
        echo "=== 檢查原始編譯輸出 ==="
        ls -la arch/arm/boot/ || true
        
        # 雙重保障：如果沒直接生成 zImage-dtb，則手動將 sawfish 的 dtb 追加到 zImage 後端
        if [ -f "arch/arm/boot/zImage-dtb" ]; then
          cp arch/arm/boot/zImage-dtb ${{ github.workspace }}/output/zImage-dtb
          echo "【狀態】成功獲取原生 zImage-dtb"
        elif [ -f "arch/arm/boot/zImage" ]; then
          echo "【警告】未找到原生 zImage-dtb，啟動手動硬體設備樹縫合..."
          if [ -f "arch/arm/boot/dts/qcom/msm8909-sawfish.dtb" ]; then
            cat arch/arm/boot/zImage arch/arm/boot/dts/qcom/msm8909-sawfish.dtb > ${{ github.workspace }}/output/zImage-dtb
            echo "【狀態】手動縫合 msm8909-sawfish.dtb 成功！"
          else
            echo "【錯誤】找不到 sawfish.dtb 設備樹檔案，編譯失敗！" && exit 1
          fi
        else
          echo "【錯誤】未找到任何編譯出的核心核心！" && exit 1
        fi

    - name: 🚀 雲端自動封裝高通引導鏡像 (使用系統內建 abootimg)
      run: |
        cd ${{ github.workspace }}/output
        
        # 1. 憑空生成一個合規的空外殼 cpio 壓縮包作為 ramdisk 佔位符
        echo -n "" | gzip > empty_ramdisk.cpio.gz
        
        # 2. 建立 abootimg 所需的標準高通引導參數配置文件
        cat << 'EOF' > bootcfg.ini
        bootsize = 0x1000000
        pagesize = 2048
        kerneladdr = 0x80008000
        ramdiskaddr = 0x81000000
        tagsaddr = 0x80000100
        cmdline = androidboot.hardware=qcom user_debug=31 msm_rtb.filter=0x3F ehci-hcd.park=3
        EOF
        
        # 3. 使用 Ubuntu 系統自帶的 abootimg 二進位工具進行精密打包，徹底避開網路下載
        abootimg -c -f bootcfg.ini -k zImage-dtb -r empty_ramdisk.cpio.gz asteroid-final-boot.img
          
        echo "=== 檢查最終打包產物 ==="
        ls -lh asteroid-final-boot.img

    - name: Upload Final Boot Image Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sawshark-final-boot-image
        path: output/asteroid-final-boot.img
