name: Compile Sawshark Kernel

on:
  workflow_dispatch: # 允許手動點擊按鈕觸發編譯

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
    # 1. 初始化工作目錄
    - name: Initialize Workspace
      uses: actions/checkout@v4

    # 2. 安裝編譯必備套件
    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev bc libssl-dev flex bison libelf-dev git ccache ncurses-dev lib32z1

    # 3. Clone 核心源代碼
    - name: Manually Clone Kernel Source
      run: |
        git clone --depth=1 https://github.com/linckandrea/android-msm-sawshark-3.18.git kernel-source

    # 4. 下載 GCC 4.9 工具鏈
    - name: Download GCC 4.9 Toolchain
      run: |
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gnu-toolchain

    # 5. 【新增步驟】列印所有內核配置檔名稱，幫我們抓出正確的 defconfig
    - name: List Available Defconfigs
      run: |
        echo "=== 正在列出 arch/arm/configs/ 底下的所有配置文件 ==="
        ls -la kernel-source/arch/arm/configs/

    # 6. 進入源代碼目錄並編譯
    - name: Configure and Build Kernel
      run: |
        cd kernel-source
        
        # 設定交叉編譯環境變數
        export ARCH=arm
        export CROSS_COMPILE=${{ github.workspace }}/gnu-toolchain/bin/arm-linux-androideabi-
        
        # 暫時沿用，如果下一步列印出來發現名字不同，我們再修改這裡
        make msm-sawshark_defconfig || make msm8909-perf_defconfig || echo "預設配置失敗，請查看上方列表"
        
        # 開始編譯核心
        make -j$(nproc) KCFLAGS=-w
